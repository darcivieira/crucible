name: customer-support-triage
version: v1
description: Classification of real support messages by operational category.
cases:
  - id: billing-001
    input: "I was charged twice on the same invoice and need a refund."
    expected_output: "billing"
    assertion:
      type: contains
    tags: [billing, refund]
  - id: billing-002
    input: "I have not received the invoice for the annual plan."
    expected_output: "billing"
    assertion:
      type: contains
    tags: [billing, invoice]
  - id: technical-001
    input: "The app closes unexpectedly when I try to attach a PDF."
    expected_output: "technical"
    assertion:
      type: contains
    tags: [technical, mobile]
  - id: technical-002
    input: "The API has been returning error 500 since yesterday."
    expected_output: "technical"
    assertion:
      type: contains
    tags: [technical, api]
  - id: account-001
    input: "I need to change the account administrator email."
    expected_output: "account"
    assertion:
      type: contains
    tags: [account]
  - id: cancellation-001
    input: "I want to cancel my subscription at the end of the month."
    expected_output: "cancellation"
    assertion:
      type: contains
    tags: [cancellation]
  - id: other-001
    input: "Do you have partnerships for educational events?"
    expected_output: "other"
    assertion:
      type: contains
    tags: [other]
