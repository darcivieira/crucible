name: basic-smoke
version: v1
description: Minimal benchmark for checking a prompt against deterministic assertions.
cases:
  - id: case-001
    input: "Say only: ok"
    expected_output: "ok"
    assertion:
      type: contains
    weight: 1.0
    tags: [smoke]
  - id: case-002
    input: "Return the number 42"
    expected_output: "42"
    assertion:
      type: contains
    weight: 1.0
    tags: [numeric]
  - id: case-003
    input: "Respond with JSON: {\"status\": \"ok\"}"
    expected_output: '{"type":"object","required":["status"]}'
    assertion:
      type: json_schema
    weight: 1.0
    tags: [json]
