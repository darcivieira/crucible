name: train-val-test-support
version: v1
description: Example with enough cases for a deterministic train/val/test split.
cases:
  - id: case-001
    input: "I was charged twice."
    expected_output: "billing"
    assertion: {type: contains}
    tags: [billing]
  - id: case-002
    input: "My card was declined on renewal."
    expected_output: "billing"
    assertion: {type: contains}
    tags: [billing]
  - id: case-003
    input: "SSO login does not work."
    expected_output: "technical"
    assertion: {type: contains}
    tags: [technical]
  - id: case-004
    input: "The page keeps loading forever."
    expected_output: "technical"
    assertion: {type: contains}
    tags: [technical]
  - id: case-005
    input: "I want to change the organization owner."
    expected_output: "account"
    assertion: {type: contains}
    tags: [account]
  - id: case-006
    input: "How do I remove a guest user?"
    expected_output: "account"
    assertion: {type: contains}
    tags: [account]
  - id: case-007
    input: "I want to end my subscription."
    expected_output: "cancellation"
    assertion: {type: contains}
    tags: [cancellation]
  - id: case-008
    input: "Do you offer a discount for universities?"
    expected_output: "other"
    assertion: {type: contains}
    tags: [other]
