name: model-comparison
version: v1
description: Compares targets for structured extraction with per-field weights.
cases:
  - id: deadline-001
    input: "The claimant is hereby notified to respond within 5 days."
    expected_output: |
      {"classification": "Deadline", "text_validation": "within 5 days"}
    assertion:
      type: field_by_field
      weights:
        classification: 95
        text_validation: 5
      field_assertions:
        classification:
          type: exact
        text_validation:
          type: contains
    tags: [deadline]
  - id: notice-001
    input: "Notify the defendant of the decision on page 23."
    expected_output: |
      {"classification": "Notice", "text_validation": "Notify the defendant"}
    assertion:
      type: field_by_field
      weights:
        classification: 95
        text_validation: 5
      field_assertions:
        classification:
          type: exact
        text_validation:
          type: contains
    tags: [notice]
  - id: other-001
    input: "I certify that the case file was submitted for a ruling."
    expected_output: |
      {"classification": "Other", "text_validation": ""}
    assertion:
      type: field_by_field
      weights:
        classification: 95
        text_validation: 5
      field_assertions:
        classification:
          type: exact
        text_validation:
          type: normalized_exact
    tags: [other]
